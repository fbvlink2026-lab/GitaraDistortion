name: Build Gitara Distortion APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and setup Gradle
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export GRADLE_HOME=/tmp/gradle-8.2
          echo "GRADLE_HOME=/tmp/gradle-8.2" >> $GITHUB_ENV
          echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Make Gradle wrapper
        run: |
          gradle wrapper --gradle-version=8.2
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Gitara-Distortion-APK
          path: app/build/outputs/apk/debug/app-debug.apk
