name: Build Gitara Distortion APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Opisyal na Android Builder — WALANG KULANG!
        uses: android-actions/setup-android@v3

      - name: ☕ Ihanda ang Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ✨ KUMUHA NG GRADLE AT AYUSIN ANG LAHAT
        run: |
          # ✅ I-download ang tamang Gradle — KUSA NANG GAGAWIN!
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 📦 BUMUO NG APK!
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Gitara-Distortion-APK
          path: app/build/outputs/apk/debug/app-debug.apk
