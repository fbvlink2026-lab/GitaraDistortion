name: Build Gitara Distortion APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'errors.md'
      - 'LICENSE'
      - '**.md'
      - '**.txt'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Ihanda ang Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ I-download at i-setup ang SIGURADONG TUGMANG GRADLE 8.2
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          export PATH=/opt/gradle/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 📦 Bumuo ng APK + KUHANIN ANG ERROR
        id: build_step
        run: |
          ./gradlew assembleDebug --no-daemon --no-build-cache 2>&1 > output.txt
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR_FOUND=true" >> $GITHUB_OUTPUT
            grep -E "^e:|error:|FAILED" output.txt | head -20 > error_log.txt
          else
            echo "ERROR_FOUND=false" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE
        shell: bash

      - name: 📝 ILAGAY SA errors.md KUNG MAY ERROR
        if: steps.build_step.outputs.ERROR_FOUND == 'true'
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S")
          {
            echo "========================================"
            echo "❌ BUILD ERROR — $DATE"
            echo "========================================"
            cat error_log.txt
            echo ""
          } > new_errors.txt
          if [ -f errors.md ]; then
            cat new_errors.txt errors.md > temp.md && mv temp.md errors.md
          else
            mv new_errors.txt errors.md
          fi
          echo "✅ NAISULAT SA errors.md!"

      - name: ✅ WALANG ERROR — ILAGAY SA errors.md
        if: steps.build_step.outputs.ERROR_FOUND == 'false'
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S")
          echo "✅ MALINIS ANG BUILD — $DATE" > latest.txt
          if [ -f errors.md ]; then
            echo "" >> latest.txt
            cat errors.md >> latest.txt
          fi
          mv latest.txt errors.md
          echo "✅ NAISULAT SA errors.md!"

      - name: 💾 I-COMMIT ANG errors.md SA GITHUB
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "✅ Auto-update errors.md" || true
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/fbvlink2026-lab/GitaraDistortion.git HEAD:main || true

      - uses: actions/upload-artifact@v4
        if: steps.build_step.outputs.ERROR_FOUND == 'false'
        with:
          name: Gitara-Distortion-APK
          path: app/build/outputs/apk/debug/app-debug.apk
