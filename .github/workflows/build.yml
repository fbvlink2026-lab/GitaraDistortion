name: Build Gitara Distortion APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: I-download at gamitin ang Gradle nang direkta
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PATH:/tmp/gradle-8.2/bin
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Gitara-Distortion-APK
          path: app/build/outputs/apk/debug/app-debug.apk
