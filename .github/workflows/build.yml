name: Build Gitara Distortion APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Run setup script
        run: |
          chmod +x setup.sh
          ./setup.sh
          ls -la  # Tignan kung nabuo ang mga file

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK direkta — walang gradlew!
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PATH:/tmp/gradle-8.2/bin
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Gitara-Distortion-APK
          path: app/build/outputs/apk/debug/app-debug.apk
