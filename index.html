<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitaraDistortion - Kumpletong Repository</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #0d1117; color: #e6edf3; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 25px; text-align: center; }

        /* 📂 Folder Button */
        .folder { margin: 6px 0; }
        .folder-btn { padding: 11px 15px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; color: #58a6ff; width: 100%; text-align: left; }
        .folder-btn:hover { background: #30363d; }

        /* 📄 Listahan — may Indent para makita ang Subfolder */
        .list { margin: 8px 0 8px 22px; display: none; border-left: 2px solid #30363d; padding-left: 14px; }
        .list.open { display: block; }
        .file { padding: 10px 14px; margin: 5px 0; background: #161b22; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .file:hover { background: #21262d; border-color: #58a6ff; }
        .file::before { content: "📄 "; }

        /* 📦 Kahon ng Laman */
        .content-box { margin-top: 30px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; display: none; }
        .content-box.open { display: block; }
        .box-header { padding: 12px 16px; background: #21262d; border-bottom: 1px solid #30363d; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .file-name { font-weight: bold; color: #58a6ff; }
        .copy-btn { background: #238636; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .copy-btn:hover { background: #2ea043; }
        .file-content { padding: 16px; white-space: pre-wrap; word-break: break-all; font-family: Consolas, Monaco, monospace; font-size: 13px; line-height: 1.6; color: #d4d4d4; max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>

<h1>🎸 GitaraDistortion - Kumpletong Repository</h1>

<!-- ====================================== -->
<!-- 📂 UGAT / PANGUNAHING DIREKTORYO -->
<!-- ====================================== -->
<div class="folder">
    <button class="folder-btn" onclick="toggle('root')">📂 Ugat / Pangunahing Direktoryo</button>
    <div class="list" id="root">

        <div class="file" onclick="show('README.md', 'Guitar FX - Gitara Distortion Effect

Proyektong pampaganda ng tunog ng gitara gamit ang Android.

✅ Kodigo: Kotlin at C++
✅ Layunin: Proseso ng tunog at epekto ng distorsyon
✅ Buuin: ./gradlew assembleDebug')">README.md</div>

        <div class="file" onclick="show('build.gradle.kts', '// Proyekto: GitaraDistortion
// Bersyon: Gradle 8.5

plugins {
    id(\"com.android.application\")
    id(\"org.jetbrains.kotlin.android\")
}

android {
    namespace = \"com.example.gitaradistortion\"
    compileSdk = 34
    defaultConfig {
        applicationId = \"com.example.gitaradistortion\"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = \"1.0\"
    }
    buildTypes { release { minifyEnabled = false } }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = \"17\" }
}

dependencies {
    implementation(\"androidx.core:core-ktx:1.12.0\")
    implementation(\"androidx.appcompat:appcompat:1.6.1\")
}')">build.gradle.kts</div>

        <div class="file" onclick="show('settings.gradle.kts', 'pluginManagement {
    repositories { google(); mavenCentral() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = \"GitaraDistortion\"
include(\":app\")')">settings.gradle.kts</div>

        <div class="file" onclick="show('gradle.properties', 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official')">gradle.properties</div>

        <div class="file" onclick="show('gradlew', '#!/bin/sh
# Gradle startup script')">gradlew</div>

        <div class="file" onclick="show('gradlew.bat', '@rem Gradle startup script
@echo off')">gradlew.bat</div>

        <div class="file" onclick="show('patch_mixer.txt', '🔧 Ayusin lahat ng parameter:
- Float na halaga
- Triple na halaga
- 3 na parameter

Layunin: Tamang paghahalo ng tunog at distorsyon')">patch_mixer.txt</div>

        <!-- 📂 SUBFOLDER: .github -->
        <div class="folder">
            <button class="folder-btn" onclick="toggle('github')">📂 .github/</button>
            <div class="list" id="github">
                <div class="folder">
                    <button class="folder-btn" onclick="toggle('workflows')">📂 workflows/</button>
                    <div class="list" id="workflows">
                        <div class="file" onclick="show('build.yml', 'name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: \"17\", distribution: \"temurin\" }
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug')">build.yml</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 📂 SUBFOLDER: app/ -->
        <div class="folder">
            <button class="folder-btn" onclick="toggle('app')">📂 app/</button>
            <div class="list" id="app">
                <div class="file" onclick="show('app/build.gradle.kts', 'plugins { id(\"com.android.application\") }
android {
    namespace = \"com.example.gitaradistortion\"
    compileSdk = 34
    defaultConfig {
        applicationId = \"com.example.gitaradistortion\"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = \"1.0\"
    }
}
dependencies {
    implementation(\"androidx.core:core-ktx:1.12.0\")
}')">app/build.gradle.kts</div>

                <!-- 📂 SUB-SUBFOLDER: app/src/ -->
                <div class="folder">
                    <button class="folder-btn" onclick="toggle('appsrc')">📂 src/</button>
                    <div class="list" id="appsrc">
                        <div class="folder">
                            <button class="folder-btn" onclick="toggle('appmain')">📂 main/</button>
                            <div class="list" id="appmain">
                                <div class="file" onclick="show('AndroidManifest.xml', '<?xml version=\"1.0\" encoding=\"utf-8\"?>
<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>
    <application android:allowBackup=\"true\" android:icon=\"@mipmap/ic_launcher\">
        <activity android:name=\".MainActivity\" android:exported=\"true\">
            <intent-filter><action android:name=\"android.intent.action.MAIN\"/>
            <category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter>
        </activity>
    </application>
</manifest>')">AndroidManifest.xml</div>

                                <!-- 📂 SUB-SUB-SUBFOLDER: java/ -->
                                <div class="folder">
                                    <button class="folder-btn" onclick="toggle('javafolder')">📂 java/</button>
                                    <div class="list" id="javafolder">
                                        <div class="file" onclick="show('MainActivity.kt', 'package com.example.gitaradistortion

import androidx.appcompat.app.AppCompatActivity
import android.os.Bundle

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
    }
}')">MainActivity.kt</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 📂 SUBFOLDER: gradle/ -->
        <div class="folder">
            <button class="folder-btn" onclick="toggle('gradle')">📂 gradle/</button>
            <div class="list" id="gradle">
                <div class="folder">
                    <button class="folder-btn" onclick="toggle('wrapper')">📂 wrapper/</button>
                    <div class="list" id="wrapper">
                        <div class="file" onclick="show('gradle-wrapper.properties', 'distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists')">gradle-wrapper.properties</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ====================================== -->
<!-- 📦 KAHON NG LAMAN NG FILE -->
<!-- ====================================== -->
<div class="content-box" id="contentBox">
    <div class="box-header">
        <span class="file-name" id="fname"></span>
        <button class="copy-btn" onclick="copy()">📋 Kopyahin</button>
    </div>
    <div class="file-content" id="fcontent"></div>
</div>

<script>
// ✅ BUKSA / ISARA ANG FOLDER AT SUBFOLDER
function toggle(id) {
    document.getElementById(id).classList.toggle('open');
}

// ✅ IPAKITA ANG LAMAN NG FILE SA KAHON
let content = "";
function show(name, text) {
    document.getElementById('fname').textContent = "📄 " + name;
    document.getElementById('fcontent').textContent = text;
    content = text;
    document.getElementById('contentBox').classList.add('open');
    window.scrollTo({ top: document.getElementById('contentBox').offsetTop - 10, behavior: 'smooth' });
}

// ✅ KOPYAHIN ANG LAMAN
function copy() {
    navigator.clipboard.writeText(content).then(() => alert("✅ NAKAKOPYA NA!"));
}
</script>

</body>
</html>
